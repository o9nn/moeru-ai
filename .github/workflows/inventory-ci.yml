name: Testing

on:
  push:
    paths:
      - inventory/**
      - .github/workflows/inventory-ci.yml
    branches:
      - main
  pull_request:
    paths:
      - inventory/**
      - .github/workflows/inventory-ci.yml
    branches:
      - main
    paths-ignore:
      - "**/*.md"

jobs:
  buildtest:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24"
          cache-dependency-path: inventory/go.sum

      # Build test
      - name: Test Build
        run: go build -a -o "release/inventory" "github.com/moeru-ai/inventory/cmd/api-server"
        working-directory: inventory

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24"
          cache-dependency-path: inventory/go.sum

      - name: Lint
        uses: golangci/golangci-lint-action@v6.1.1
        with:
          # Optional: golangci-lint command line arguments.
          args: "--timeout=10m"

  lint-ts:
    name: Lint TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

          cache-dependency-path: inventory/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: inventory

      - name: Lint
        run: pnpm lint
        working-directory: inventory

  build-ts:
    name: Build TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

          cache-dependency-path: inventory/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: inventory

      - name: Build
        run: pnpm build
        working-directory: inventory

  typecheck-ts:
    name: Typecheck TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

          cache-dependency-path: inventory/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: inventory

      - name: Typecheck
        run: pnpm typecheck
        working-directory: inventory

  test-ts:
    name: Test TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

          cache-dependency-path: inventory/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: inventory

      - name: Test
        run: pnpm test
        working-directory: inventory

  run-jem-validator:
    name: Run JEM Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "pnpm"

          cache-dependency-path: inventory/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: inventory

      - name: Run JEM Validator
        run: pnpm run jem-validator
        working-directory: inventory
        env:
          OPENAI_API_KEY: ${{ secrets.JEM_OPENAI_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.JEM_MINIMAX_API_KEY }}
          MINIMAXI_API_KEY: ${{ secrets.JEM_MINIMAXI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.JEM_GOOGLE_API_KEY }}

  unittest:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.24"
          cache-dependency-path: inventory/go.sum

      - name: Unit tests
        run: |
        working-directory: inventory
          go test ./... -coverprofile=coverage.out -covermode=atomic -p=1
          go tool cover -func coverage.out
