name: GitHub Pages

on:
  push:
    paths:
      - deck/**
      - .github/workflows/deck-gh-pages.yml
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    uses: importantimport/.github/.github/workflows/pnpm-gh-pages.yml@main
    with:
      publish_dir: docs/dist
      cname: deck.moeru.ai
