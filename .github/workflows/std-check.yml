name: check

on:
  pull_request:
    paths:
      - std/**
      - .github/workflows/std-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

          cache-dependency-path: std/pnpm-lock.yaml
      - run: pnpm install
        working-directory: std
      - run: pnpm lint
        working-directory: std
      - run: pnpm test
        working-directory: std
      - run: pnpm build
        working-directory: std
