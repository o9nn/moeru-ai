name: CI

on:
  push:
    paths:
      - eventa/**
      - .github/workflows/eventa-ci.yml
    branches:
      - main

  pull_request:
    paths:
      - eventa/**
      - .github/workflows/eventa-ci.yml
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

          cache-dependency-path: eventa/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: eventa

      - name: Lint
        run: pnpm run lint
        working-directory: eventa

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

          cache-dependency-path: eventa/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: eventa

      - name: Build
        run: |
        working-directory: eventa
          pnpm run build

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

          cache-dependency-path: eventa/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: eventa

      - name: Build
        run: |
        working-directory: eventa
          pnpm run build

      - name: Unit Test
        run: pnpm run test:run
        working-directory: eventa

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

          cache-dependency-path: eventa/pnpm-lock.yaml
      - name: Install
        run: pnpm install
        working-directory: eventa

      - name: Typecheck
        run: pnpm run typecheck
        working-directory: eventa
