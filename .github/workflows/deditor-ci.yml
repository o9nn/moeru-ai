name: CI

on:
  push:
    paths:
      - deditor/**
      - .github/workflows/deditor-ci.yml
    branches:
      - main

  pull_request:
    paths:
      - deditor/**
      - .github/workflows/deditor-ci.yml
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

          cache-dependency-path: deditor/pnpm-lock.yaml
      - name: Install
        run: pnpm install
          working-directory: deditor

      - name: Lint
        run: |
          working-directory: deditor
          pnpm run lint

  build-test:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

          cache-dependency-path: deditor/pnpm-lock.yaml
      - name: Install
        run: pnpm install
          working-directory: deditor

      - name: Build
        run: |
          working-directory: deditor
          pnpm run build:unpack

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

          cache-dependency-path: deditor/pnpm-lock.yaml
      - name: Install
        run: pnpm install
          working-directory: deditor

      - name: Build
        run: |
          working-directory: deditor
          pnpm run build

      - name: Typecheck
        run: pnpm run typecheck
          working-directory: deditor
