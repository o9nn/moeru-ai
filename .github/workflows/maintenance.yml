name: Maintenance

on:
  pull_request:
    branches:
      - main
    paths:
      - 'airi/**'
      - 'xsai/**'
      - '.github/workflows/maintenance.yml'
  push:
    branches:
      - main
    paths:
      - 'airi/**'
      - 'xsai/**'
      - '.github/workflows/maintenance.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  # Detect which projects have changes
  changes:
    runs-on: ubuntu-latest
    outputs:
      airi: ${{ steps.filter.outputs.airi }}
      airi-nix: ${{ steps.filter.outputs.airi-nix }}
      xsai: ${{ steps.filter.outputs.xsai }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            airi:
              - 'airi/**'
            airi-nix:
              - 'airi/apps/stage-tamagotchi/package.json'
              - 'airi/apps/stage-tamagotchi/vite.config.ts'
            xsai:
              - 'xsai/**'

  autofix-airi:
    needs: changes
    if: needs.changes.outputs.airi == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Autofix airi
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: airi/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: airi/pnpm-lock.yaml

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: airi/.turbo
          key: ${{ runner.os }}-airi-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-airi-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: airi

      - name: Lint fix
        run: pnpm run lint:fix
        working-directory: airi

      - uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27

  autofix-xsai:
    needs: changes
    if: needs.changes.outputs.xsai == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    name: Autofix xsai
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          run_install: false
          package_json_file: xsai/package.json

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: xsai/pnpm-lock.yaml

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: xsai/.turbo
          key: ${{ runner.os }}-xsai-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-xsai-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: xsai

      - name: Lint fix
        run: pnpm lint --fix
        working-directory: xsai

      - uses: autofix-ci/action@635ffb0c9798bd160680f18fd73371e355b85f27

  # Nix assets hash update (airi only)
  nix-assets-hash:
    needs: changes
    if: needs.changes.outputs.airi-nix == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: nix-update-assets
    name: Update Nix assets hash
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Update Hash
        run: nix/update-assets-hash.sh
        working-directory: airi

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore(nix): update assets hash'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>

  # Nix pnpm deps hash update (airi only)
  nix-pnpm-deps-hash:
    needs: changes
    if: needs.changes.outputs.airi == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: nix-update-pnpm-deps
    name: Update Nix pnpm deps hash
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes

      - name: Update Hash
        run: nix/update-pnpm-deps-hash.sh
        working-directory: airi

      - uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: 'chore(nix): update pnpm deps hash'
          commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
