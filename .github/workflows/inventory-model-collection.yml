name: Model Collection

# https://docs.github.com/en/actions/how-tos/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions:
  issues: write
  pull-requests: write
  contents: write

on:
  issues:
    types:
      - opened
      - edited
      - reopened

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-issues-fetcher:
    if: startsWith(github.event.issue.title, '[Model Collection]:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: inventory/package.json
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"

          cache-dependency-path: inventory/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: inventory

      - name: Run issues fetcher
        run: pnpm run fetch-issues
        working-directory: inventory
        env:
          ISSUE_ID: ${{ github.event.issue.number }}
          TRIGGER_ACTION: ${{ github.event.action }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          TARGET_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: github-actions
