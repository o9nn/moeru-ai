name: Release SDK

on:
  push:
    paths:
      - unspeech/**
      - .github/workflows/unspeech-release-sdk.yml
    tags:
      - 'v*'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: latest
          registry-url: https://registry.npmjs.org
          cache-dependency-path: unspeech/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: unspeech
      - working-directory: unspeech/sdk/typescript
        run: pnpm -F unspeech build
      - run: pnpm publish -r --no-git-checks --access public
        working-directory: unspeech
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
