name: gh-pages

on:
  push:
    paths:
      - xsai/**
      - .github/workflows/xsai-gh-pages.yml
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: importantimport/.github/.github/workflows/pnpm-gh-pages-artifact.yml@main
    with:
      build: pnpm -r build
      path: docs/out
      node-version: 24
