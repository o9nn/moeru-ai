name: publish

on:
  push:
    paths:
      - cosine-similarity/**
      - .github/workflows/cosine-similarity-publish.yml
    tags:
      - 'v*'
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: latest
          registry-url: https://registry.npmjs.org
          cache-dependency-path: cosine-similarity/pnpm-lock.yaml
      - run: pnpm install
        working-directory: cosine-similarity
      - run: pnpm dlx changelogithub
        working-directory: cosine-similarity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm -r build
        working-directory: cosine-similarity
      - run: pnpm -r publish --no-git-checks --access public
        working-directory: cosine-similarity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
