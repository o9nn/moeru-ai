name: check

on:
  pull_request:
    paths:
      - talk/**
      - .github/workflows/talk-check.yml
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: latest
          registry-url: https://registry.npmjs.org
          cache-dependency-path: talk/pnpm-lock.yaml
      - run: pnpm install
        working-directory: talk
      - run: pnpm build
        working-directory: talk
      - run: pnpm lint
        working-directory: talk
