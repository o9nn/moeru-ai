name: CI

on:
  push:
    paths:
      - mcp-launcher/**
      - .github/workflows/mcp-launcher-ci.yaml
    branches:
      - main
  pull_request:
    paths:
      - mcp-launcher/**
      - .github/workflows/mcp-launcher-ci.yaml
    branches:
      - main

env:
  STORE_PATH: ""

jobs:
  build-test:
    name: Build Test
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Test Build
        run: go build ./...
        working-directory: mcp-launcher

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v3.4.0
        with:
          # Optional: golangci-lint command line arguments.
          args: "--timeout=10m"

  unittest:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: mcp-launcher/go.sum

      - name: Unit tests
        run: |
        working-directory: mcp-launcher
          go test ./... -coverprofile=coverage.out -covermode=atomic -p=1
          go tool cover -func coverage.out
