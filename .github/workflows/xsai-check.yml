name: check

on:
  pull_request:
    paths:
      - xsai/**
      - .github/workflows/xsai-check.yml
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

          cache-dependency-path: xsai/pnpm-lock.yaml
      - run: pnpm install
        working-directory: xsai
      - run: pnpm lint
        working-directory: xsai

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

          cache-dependency-path: xsai/pnpm-lock.yaml
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - run: pnpm install
        working-directory: xsai
      - run: pnpm build
        working-directory: xsai

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 24
          registry-url: https://registry.npmjs.org

          cache-dependency-path: xsai/pnpm-lock.yaml
      - uses: ai-action/setup-ollama@v1
      - uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ${{ runner.os }}-ollama
      - run: ollama pull all-minilm
      - run: ollama pull granite3.3:2b
      - run: ollama pull qwen3:0.6b
      - run: ollama serve > /dev/null 2>&1 &

      - run: pnpm install
        working-directory: xsai
      - run: pnpm test
        working-directory: xsai
